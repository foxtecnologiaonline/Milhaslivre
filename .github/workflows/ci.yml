name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w apps/api

      - name: Unit tests
        run: npm test -w apps/api

      - name: E2E tests
        run: npm run test:e2e -w apps/api

      - name: Build
        run: npm run build -w apps/api

  web:
    name: Web (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w apps/web

      - name: Tests
        run: npm test -w apps/web

      - name: Build
        run: npm run build -w apps/web
